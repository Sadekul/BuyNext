; BuyNest PHP-FPM pool. Loaded last (zzz-), so it overrides the base image's
; www.conf and zz-docker.conf. PHP-FPM runs as www-data (start.sh switches
; user before starting it), so there is no user/group line here.
[global]
error_log = /proc/self/fd/2
log_limit = 8192
daemonize = no

[www]
; Only nginx in the same container talks to PHP-FPM.
listen = 127.0.0.1:9000

; How many requests PHP handles at once. Each worker uses about 30-60 MB;
; raise PHP_FPM_MAX_CHILDREN on a bigger Railway plan (minimum 2).
pm = dynamic
pm.max_children = ${PHP_FPM_MAX_CHILDREN}
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 2
pm.max_requests = 500

; Keep Railway's variables visible to PHP (Laravel reads them).
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
access.log = /dev/null
request_terminate_timeout = 65s
