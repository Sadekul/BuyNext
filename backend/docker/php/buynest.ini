; BuyNest production PHP settings (loaded after php.ini-production).

; Product photo uploads: up to 10 files of 5 MB each per request. nginx's
; client_max_body_size (docker/nginx/nginx.conf.template) matches post_max_size.
upload_max_filesize = 5M
post_max_size = 60M
max_file_uploads = 10

memory_limit = 256M
max_execution_time = 60
expose_php = Off

; Errors go to the container log (Railway's "Logs" tab), never to visitors.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /proc/self/fd/2

; OPcache keeps compiled PHP in memory. The code never changes inside a
; running container, so PHP doesn't need to check files for changes
; (validate_timestamps = 0); a redeploy starts a fresh container.
opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.save_comments = 1

realpath_cache_size = 4096K
realpath_cache_ttl = 600
