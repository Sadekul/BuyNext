; BuyNest development PHP settings: dev.sh and demo.sh add this folder to PHP's
; ini scan list (PHP_INI_SCAN_DIR), so `php artisan serve` accepts the same
; upload sizes as production (docker/php/buynest.ini): product photos 10 × 5 MB,
; review photos 3 × 5 MB (phase 22). Without it the computer's php.ini default
; (often 2 MB per file, 8 MB per request) refuses larger photos.
upload_max_filesize = 5M
post_max_size = 60M
max_file_uploads = 10
